function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function shade(h,f){const c=hex2rgb(h).map(v=>f<1?v*f:v+(255-v)*(f-1));return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}
function alpha(h,a){const c=hex2rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(s,x,y,size,col,align='center',o={}){
  ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';s=String(s);
  if(o.stroke!==false){ctx.lineJoin='round';ctx.strokeStyle=o.sc||'#150f2e';ctx.lineWidth=size*(o.sw||0.3);ctx.strokeText(s,x,y+size*0.09);ctx.strokeText(s,x,y);}

}
function ellipse(x,y,rx,ry,fill,stroke,lw){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}

let AC=null,muted=false,noiseBuf=null;
function sfx(type){
  if(muted)return;
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*0.5;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const tone=(f0,f1,dur,wave='square',vol=0.06,delay=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.setValueAtTime(f0,t+delay);o.frequency.exponentialRampToValueAtTime(f1,t+delay+dur);g.gain.setValueAtTime(vol,t+delay);g.gain.exponentialRampToValueAtTime(0.0001,t+delay+dur);o.connect(g);g.connect(AC.destination);o.start(t+delay);o.stop(t+delay+dur+0.02);};
    const noise=(dur,vol=0.08,freq=900)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur);};
    if(type==='blip')tone(660,700,0.05,'triangle',0.06);
    else if(type==='pass')tone(380,820,0.13,'triangle',0.09);
    else if(type==='shot'){tone(180,900,0.22,'sawtooth',0.04);noise(0.25,0.05,2000);}
    else if(type==='move'){tone(300,1400,0.3,'triangle',0.07);tone(600,1800,0.25,'sine',0.05,0.05);}
    else if(type==='tackle')noise(0.16,0.12,700);
    else if(type==='break')tone(300,1200,0.18,'triangle',0.06);
    else if(type==='enc'){tone(520,520,0.07,'square',0.04);tone(780,780,0.09,'square',0.04,0.08);}
    else if(type==='goal'){[523,659,784,1046].forEach((f,i)=>tone(f,f,0.18,'triangle',0.08,i*0.1));noise(1.2,0.06,1200);}
    else if(type==='save'){tone(400,200,0.2,'triangle',0.07);noise(0.2,0.06,500);}
    else if(type==='status'){tone(900,300,0.25,'sine',0.06);}
    else if(type==='whistle'){tone(1900,1700,0.35,'sine',0.07);}
    else if(type==='elem_poison'){[0,0.07,0.14,0.21].forEach((d,i)=>tone(300-i*30,160-i*20,0.12,'sine',0.06,d));noise(0.3,0.03,600);}
    else if(type==='elem_sleep'){[880,660,990,740].forEach((f,i)=>tone(f,f*0.98,0.3,'sine',0.045,i*0.09));}
    else if(type==='elem_hex'){tone(220,880,0.35,'sawtooth',0.03);tone(330,1320,0.35,'sine',0.04,0.05);}
    else if(type==='elem_fire'){noise(0.45,0.09,2400);tone(120,500,0.4,'sawtooth',0.04);}
    else if(type==='elem_swirl'||type==='elem_whirl'){tone(400,1200,0.25,'sine',0.05);tone(1200,400,0.25,'sine',0.04,0.2);}
    else if(type==='elem_ice'){[1800,2400,2100,2800].forEach((f,i)=>tone(f,f,0.08,'triangle',0.035,i*0.05));noise(0.2,0.04,5000);}
    else if(type==='elem_drain'){tone(700,150,0.45,'sawtooth',0.035);}
    else if(type==='elem_shield'){tone(500,500,0.3,'square',0.03);tone(750,750,0.3,'triangle',0.04,0.05);}
    else if(type.startsWith('elem_')){tone(300,1400,0.3,'triangle',0.07);noise(0.25,0.05,1500);}
    else if(type==='level'){[523,784,1046,1318].forEach((f,i)=>tone(f,f,0.14,'triangle',0.07,i*0.09));}
  }catch(e){}
}

function makePlayer(team,name,pos,st,skin,hair,hs){
  const p={team,name,pos,isGK:pos==='GK',skin,hair,hs,x:CX,y:CY,vx:0,vy:0,face:team?1:0,anim:Math.random()*4,stun:0,immune:0,run:null,runHold:0,target:null,

  STAT_KEYS.forEach((k,i)=>p[k]=st[i]);p.hp=p.end;dress(p,null);if(p.race==='synthari')p.hs=1;return p;
}
function applyLevelStats(p){STAT_KEYS.forEach((k,i)=>{p[k]=Math.max(1,Math.round(p.base[i]*curveMult(p.rec,p.level,i)*posPen(p,i)));});}
function xpFrom(p,final,win){const s=p.stats,b=p.xpBase||{};const d=k=>(s[k]||0)-(b[k]||0);
  return Math.round((d('g')*30+d('as')*12+d('sh')*4+d('pa')*6+d('tk')*10+d('br')*6+d('sv')*8+d('ic')*10+d('pr')*3+(G.score[0]-(G.xpGoalsBase||0))*4+(final?10+(win?20:0):5))*(G.away.xpMult||1));}
function awardXP(final,win){
  const ups=[];
  for(const p of teamOf(0)){
    const g=Math.round(xpFrom(p,final,win)*(1+0.15*facLv('train')));p.xpGain=(p.xpGain||0)+g;p.xpHalf=g;p.xpBase=Object.assign({},p.stats);
    const sv=psave(p.name);const before=lvlOf(sv.xp);sv.xp+=g;p.xp=sv.xp;const after=lvlOf(sv.xp);
    if(after>before){const nm=p.moveTable.filter(m=>m[1]>before&&m[1]<=after).map(m=>m[0]);
      const old={};STAT_KEYS.forEach(k=>old[k]=p[k]);p.level=after;const hpF0=p.hp/p.end;applyLevelStats(p);p.hp=p.end*hpF0;
      const spOld=p.spMax;p.spMax=spMaxFor(p.spBase,p.level);p.sp+=p.spMax-spOld;
      nm.forEach(id=>{if(!p.moves.includes(id))p.moves.push(id);});
      ups.push({p,lv:after,moves:nm.map(id=>MOVES[id].name),gain:STAT_KEYS.map(k=>p[k]-old[k]).reduce((a,b)=>a+b,0)});}
  }
  G.xpGoalsBase=G.score[0];persist();if(ups.length)setTimeout(()=>sfx('level'),400);return ups;
}
function buildHome(){initTeam();const L=SAVE.team.lineup;return SLOTS.map(slot=>makeFromRec(recOf(L[slot]),slot));}
function setupMatch(key){
  const away=TEAMS[key];G.away=away;G.awayKey=key;
  G.players=buildHome();G.bench=buildBench();G.seasonGame=!!G.nextSeasonGame;G.nextSeasonGame=false;G.halfView=null;G.subSel=null;
  initClubs();buildAway(key).forEach(p=>{p.fixedRank=away.rank;p.spBase=Math.round(rnd(20,32));p.spMax=spMaxFor(p.spBase,Math.max(p.level||1,1+(away.rank-1)*2));p.sp=p.spMax;G.players.push(p);});
  G.score=[0,0];G.half=1;G.clock=HALF_LEN;G.mercy=false;G.beat=0;G.halfUps=[];G.marks={};G.xpGoalsBase=0;G.players.forEach(p=>{p.xpGain=0;p.xpBase={};});G.copied=[];G.why=null;G.lastPasser=null;G.poss=SHOT_CLOCK;G.popups=[];G.fxRings=[];G.flight=null;G.party=0;G.menu=null;bgCache=null;
  kickoff(0);

function part(o){if(G.auto||G.parts.length>400)return;G.parts.push(Object.assign({vx:0,vy:0,life:0.8,size:1.2,kind:'dot',rot:Math.random()*6},o,{max:o.life||0.8}));}
function burst(x,y,col,n,mv){
  const m=mv?MOVES[mv]:null,fx=m&&m.fx;
  for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=rnd(10,45);
    part({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,col,life:rnd(0.4,0.9),size:rnd(0.8,2),kind:fx==='poison'?'blob':fx==='sleep'?'star':fx==='weak'?'ring':m&&m.special==='multi'?'shard':'dot'});}
  G.fxRings.push({x,y,col,t:0.6});
}
function trail(f){
  const m=f.mv?MOVES[f.mv]:null;if(!m){if(Math.random()<0.5)G.bubbles.push({x:f.x,y:f.y,vy:-rnd(2,8),vx:0,s:0.7,life:0.6});return;}
  const dx=f.x-f.px,dy=f.y-f.py,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
  if(m.fx==='poison'){for(let i=0;i<2;i++)part({x:f.x+rnd(-2,2),y:f.y+rnd(-2,2),vx:rnd(-4,4),vy:rnd(-8,-2),col:Math.random()<0.5?'#7fe04a':'#3fae2a',life:rnd(0.6,1.2),size:rnd(1.2,2.6),kind:'blob'});}
  else if(m.fx==='sleep'){part({x:f.x+rnd(-3,3),y:f.y+rnd(-3,3),vx:rnd(-5,5),vy:rnd(-10,-3),col:Math.random()<0.6?'#d9c8ff':'#b58cff',life:rnd(0.6,1),size:rnd(1,2),kind:'star'});if(Math.random()<0.15)part({x:f.x,y:f.y,vy:-12,col:'#e7dcff',life:1,size:4,kind:'z'});}
  else if(m.fx==='weak'){part({x:f.x,y:f.y,col:'#ff6fcf',life:0.5,size:rnd(1.5,3),kind:'ring'});}
  else if(m.special==='curve'){const w=Math.sin(G.time*30)*4;part({x:f.x+nx*w,y:f.y+ny*w,col:'#5fd3ff',life:0.5,size:1.4});part({x:f.x-nx*w,y:f.y-ny*w,col:'#dff6ff',life:0.5,size:1});}
  else if(m.special==='multi'){for(let i=0;i<2;i++)part({x:f.x+rnd(-3,3),y:f.y+rnd(-3,3),vx:-dx/d*rnd(10,30)+rnd(-8,8),vy:-dy/d*rnd(10,30)+rnd(-8,8),col:Math.random()<0.5?'#ffffff':'#9fe8ff',life:rnd(0.3,0.6),size:rnd(1.5,3),kind:'shard'});}
  else{for(let i=0;i<2;i++)part({x:f.x,y:f.y,vx:-dx/d*rnd(15,35)+rnd(-6,6),vy:-dy/d*rnd(15,35)+rnd(-6,6),col:Math.random()<0.5?'#ffb13b':'#ff6a2a',life:rnd(0.25,0.5),size:rnd(1,2.2)});}
}
function drawParts(){
  for(const q of G.parts){const a=clamp(q.life/q.max,0,1);ctx.globalAlpha=a;
    if(q.kind==='blob'){ellipse(q.x,q.y,q.size,q.size,q.col);ellipse(q.x-q.size*0.3,q.y-q.size*0.3,q.size*0.3,q.size*0.3,'rgba(255,255,255,0.6)');}
    else if(q.kind==='star'){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot+G.time*3);ctx.fillStyle=q.col;ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?q.size*0.4:q.size*1.3,an=i*Math.PI/4;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}ctx.fill();ctx.restore();}
    else if(q.kind==='ring'){ellipse(q.x,q.y,q.size*(2-a),q.size*(2-a),null,q.col,0.7);}

    else if(q.kind==='bub'){ellipse(q.x,q.y,q.size,q.size,'rgba(220,250,255,0.18)',q.col,0.35);}
    else if(q.kind==='z'){txt('z',q.x,q.y,q.size,q.col,'center',{sw:0.25});}

}

const TIPS={
  start:{t:'YOUR BALL',l:['Tap the water to swim there.','Tap a teammate to pass, tap the','goal at the top to shoot.','You have 25 seconds per possession.']},
  encounter:{t:'ENCOUNTER!',l:['A defender reached you. The odds','are on each button - green is good.','Outnumbered? Passing usually','beats trying to break through.']},
  defend:{t:'DEFENDING',l:['Your defenders chase on their own.','Tap water to send the nearest one','there, or Pause + Plan to set','up a wall in front of your goal.']}};
function showTip(k){if(G.auto||SAVE.tips[k]||!TIPS[k])return;G.tipPrev=G.state;G.tipKey=k;G.state='tip';}
const LADDER=['practice','currents','breakers','undertow'];
const unlockedTeam=k=>k==='practice'||k==='currents'||SAVE.beaten[LADDER[LADDER.indexOf(k)-1]];
function encounterCheck(){
  const c=G.carrier;if(!c||c.immune>0)return;
  const close=opp(c).filter(o=>!isOut(o)&&dist(o,c)<9);if(!close.length)return;
  const engaged=engagedOf(c);
  if(c.team===0&&!G.auto){
    G.state='encounter';G.enc=engaged;G.menu=null;G.pickPass=false;G.passMove=null;sfx('enc');pushCut({k:'enc',a:c,d:[...engaged].sort((a,b)=>S(b,'blk')-S(a,'blk')),dur:1.0});showTip('encounter');
    G.aiTackle=aiTackleFor(engaged);
    G.odds={brk:odds(()=>simBreak(c,engaged,null,G.aiTackle),200),shot:shotRange(c)?odds(()=>simShot(c,engaged),200):null,pass:passOddsMap(c,engaged,null)};
  }else if(c.team===1){
    const lead=engaged[0];// closest
    G.enc=engaged;G.defLead=lead;pushCut({k:'enc',a:c,d:engaged,dur:0.9});
    const tackles=lead?movesOfType(lead,'tackle').filter(id=>canUse(lead,id)):[];
    // the human always picks their tackle - basic tackle is always on offer, special tackles when owned
    if(!G.auto&&lead){G.state='defEnc';G.defOdds=defStopOdds(c,engaged,lead);sfx('enc');}
    else{let tk=null;if(G.auto&&tackles.length&&Math.random()<0.6)tk={p:lead,id:tackles[0]};startAiEnc(tk);}
  }else{
    const tk=aiTackleFor(engaged);const ch=aiChoose(c,engaged,tk);execChoice(c,ch,engaged,tk);
  }
}
function aiTackleFor(engaged){
  const lead=engaged[0];if(!lead)return null;// closest defender (engagedOf sorts by distance)
  const t=movesOfType(lead,'tackle').filter(id=>canUse(lead,id));
  return t.length&&Math.random()<0.7?{p:lead,id:t[(Math.random()*t.length)|0]}:null;
}
// Chance each tackle stops the carrier IF they try a basic break. Computed once when the defence screen opens.
// It's conditional on purpose: the carrier picks break/pass/shot after the defender commits, so we don't guess that.
function defStopOdds(c,engaged,lead){const m={};[null,...movesOfType(lead,'tackle')].forEach(id=>{m[id||'basic']=1-odds(()=>simBreak(c,engaged,null,id?{p:lead,id}:null),200);});return m;}
function startAiEnc(tk){
  const c=G.carrier;G.homeTackle=tk;const ch=aiChoose(c,G.enc,tk);G.aiChoice=ch;G.state='aiEnc';G.timer=0.75;

function execChoice(c,ch,en,tk){if(ch.k==='break')doBreak(c,en,ch.mv,tk);else if(ch.k==='shot')doShot(c,en,ch.mv);else doPass(c,ch.m,en,ch.mv);}
function aiChoose(c,engaged,tk){
  const g=attackGoal(c.team),dg=dist(c,g),opts=[];
  for(const mv of [null,...movesOfType(c,'break').filter(id=>canUse(c,id))])opts.push({k:'break',mv,v:odds(()=>simBreak(c,engaged,mv,tk),40),label:mv?MOVES[mv].name.toUpperCase():'BREAK!'});
  if(dg<105)for(const mv of [null,...movesOfType(c,'shot').filter(id=>canUse(c,id))]){const o=odds(()=>simShot(c,engaged,mv),40);opts.push({k:'shot',mv,v:o*(dg<90?1.7:1.0)+(mv&&MOVES[mv].fx?0.05:0),label:mv?MOVES[mv].name.toUpperCase():'SHOOT!'});}
  const pm=movesOfType(c,'pass').filter(id=>canUse(c,id));
  for(const m of teamOf(c.team)){if(m===c||m.isGK)continue;const prog=(dg-dist(m,g))/80;
    for(const mv of [null,pm.length&&Math.random()<0.6?pm[(Math.random()*pm.length)|0]:null]){if(mv===null&&opts.some(o=>o.m===m&&o.mv===null))continue;const o=odds(()=>simPass(c,m,engaged,mv),30);opts.push({k:'pass',m,mv,v:o*0.85+prog*0.25+(mv&&MOVES[mv].fx?0.06:0),label:mv?MOVES[mv].name.toUpperCase():'PASS!'});}}

function aiCarrier(c,dt){
  const g=attackGoal(c.team),dg=dist(c,g);
  const press=Math.min(99,...opp(c).map(o=>isOut(o)?99:dist(o,c)));
  c.think-=dt;
  if(c.isGK){c.hold+=dt;c.target={x:c.x,y:c.y};if(c.hold>0.9){let best=null,bv=-1;for(const m of teamOf(c.team)){if(m===c)continue;const o=odds(()=>simPass(c,m,[]),30);if(o>bv){bv=o;best=m;}}doPass(c,best,[],null);}return;}
  if(c.isGK)return;
  if(c.think<=0){
    c.think=(c.team===1?G.away.ai.think:0.6)*(0.8+Math.random()*0.5);
    if(dg<88&&press>9&&Math.random()<0.8||dg<118&&press>18&&Math.random()<0.45){const sm=movesOfType(c,'shot').filter(id=>canUse(c,id));doShot(c,[],sm.length&&Math.random()<0.6?sm[0]:null);return;}
    if(press<45){for(const m of teamOf(c.team)){if(m===c||m.isGK)continue;if(dist(m,g)<dg-18){const o=odds(()=>simPass(c,m,[]),30);if(o>0.7&&Math.random()<0.75){const pm=movesOfType(c,'pass').filter(id=>canUse(c,id));doPass(c,m,[],pm.length&&Math.random()<0.4?pm[0]:null);return;}}}}
  }
  let vx=(g.x-c.x)/(dg||1),vy=(g.y-c.y)/(dg||1);
  for(const o of opp(c)){const d=dist(o,c);if(d<32&&d>0.1){const f=(32-d)/32*1.3;vx+=(c.x-o.x)/d*f;vy+=(c.y-o.y)/d*f;}}
  c.target={x:c.x+vx*20,y:c.y+vy*20};
}
function updatePlayers(dt){
  const c=G.carrier;
  const dgoal=c?dist(c,attackGoal(c.team)):999,threat=dgoal<125,danger=dgoal<70;
  const dst=c?styleOf(1-c.team):null;
  let maxCh=c?(threat?2:1)+(danger&&dst.form==='defense'?1:0):0;
  if(c&&dst.form==='press')maxCh=Math.max(maxCh,3);if(c&&dst.form==='bunker')maxCh=Math.min(maxCh,danger?2:1);
  if(c&&c.isGK)maxCh=0;
  if(c&&c.team===1)maxCh=Math.min(maxCh,2);
  if(c&&c.team===0)maxCh=Math.min(maxCh,G.away.ai.maxCh+(threat?1:0));
  const chasers=c&&!(c.team===0&&G.grace>0)?opp(c).filter(p=>!p.isGK&&!isOut(p)&&dist(p,c)<(threat?130:90)).sort((a,b)=>dist(a,c)-dist(b,c)).slice(0,maxCh):[];
  const gkCharge=c&&danger&&c.immune<=0&&!c.isGK?gkOf(1-c.team):null;
  const L=G.loose,looseCh=new Set();if(L){for(const t of [0,1]){G.players.filter(q=>q.team===t&&!isOut(q)&&(!q.isGK||Math.hypot(q.x-L.x,q.y-L.y)<40)).sort((a,b)=>Math.hypot(a.x-L.x,a.y-L.y)/(10+S(a,'spd'))-Math.hypot(b.x-L.x,b.y-L.y)/(10+S(b,'spd'))).slice(0,2).forEach(q=>looseCh.add(q));}}
  for(const p of G.players){
    p.stun=Math.max(0,p.stun-dt);p.immune=Math.max(0,p.immune-dt);
    for(const k in p.fx)p.fx[k]=Math.max(0,p.fx[k]-dt);
    if(p===c){const drain=p.fx.poison>0?1.6:0.35;const was=p.hp;p.hp=Math.max(0,p.hp-dt*drain);if(was>0&&p.hp<=0&&!G.auto)popup('EXHAUSTED - STATS HALVED',p.x,p.y-24,'#ff8a8a',5.5);if(p.fx.poison>0){p.ptick=(p.ptick||0)+dt;if(p.ptick>1.5){p.ptick=0;if(!G.auto)popup('-4 HP',p.x+4,p.y-8,'#7fe04a',5);}}}
    else if(p.fx.poison<=0)p.hp=Math.min(p.end,p.hp+dt*(c&&c.team!==p.team&&styleOf(p.team).form==='press'&&chasers.includes(p)?-0.25:0.6*(p.team===0?1+0.15*facLv('medical'):1)));
    let T=null,sf=1;const hasBall=c&&c.team===p.team;
    if(p===c){
      if(p.team===1||G.auto)aiCarrier(p,dt);
      if(G.carrier!==p)continue;
      T=p.target;sf=0.9;if(T&&dist(p,T)<2&&p.team===0)p.target=null;
    }else if(L&&looseCh.has(p)){T={x:L.x+L.vx*0.3,y:L.y+L.vy*0.3};sf=1.1;
    }else if(p.run){T=p.run;sf=1.05;if(dist(p,p.run)<3){p.runHold+=dt;if(p.runHold>(hasBall?1.8:1.4)){p.run=null;p.runHold=0;}}}
    else if(c&&!hasBall&&chasers.includes(p)){T={x:c.x+c.vx*0.35,y:c.y+c.vy*0.35};sf=p.team===1?G.away.ai.chase:0.97;}
    else{
      const s=spot(p,hasBall);T=s;
      if(c&&!hasBall&&!p.isGK){const own=attackGoal(1-p.team);let near=null,nd=999;for(const a of teamOf(c.team)){if(a===c||a.isGK)continue;const d=dist(a,s);if(d<nd){nd=d;near=a;}}
        const mk=p.team===0&&G.marks&&G.marks[p.name];if(mk&&mk!==c){T={x:mk.x*0.8+own.x*0.2,y:mk.y*0.8+own.y*0.2};}
        else if(manCover(p.team)){if(near)T={x:near.x*0.75+own.x*0.1+s.x*0.15,y:near.y*0.75+own.y*0.1+s.y*0.15};}
        else if(near&&nd<30)T={x:near.x*0.5+own.x*0.15+s.x*0.35,y:near.y*0.5+own.y*0.15+s.y*0.35};
        if(threat&&dist(p,c)<60){const k=(danger?0.55:0.3)*(p.team===0?0.45:1);T={x:T.x+(c.x-T.x)*k,y:T.y+(c.y-T.y)*k};}}
      p.__gk=p===gkCharge;if(p.__gk){const own=attackGoal(c.team);T={x:own.x+(c.x-own.x)*0.45,y:own.y+(c.y-own.y)*0.45};}
      if(hasBall&&!p.isGK&&(p.team===0||styleOf(p.team).form==='spread')){const rr=styleOf(p.team).form==='spread'?30:22;let nd=99,no=null;for(const o of opp(p)){const d=dist(o,T);if(d<nd){nd=d;no=o;}}if(no&&nd<rr&&nd>0.1){const k=(rr-nd)*(rr>22?1.2:0.9);T=clampSphere(T.x+(T.x-no.x)/nd*k,T.y+(T.y-no.y)/nd*k,9);}}

    }

    if(T){const dx=T.x-p.x,dy=T.y-p.y,d=Math.hypot(dx,dy);if(d>0.8){const sp=(10+S(p,'spd')*0.62)*sf*(p.stun>0?0.25:1)*(0.75+0.25*p.hp/p.end)*Math.min(1,d/8);dvx=dx/d*sp;dvy=dy/d*sp;}}

    if(!p.isGK)for(const gy of [CY-R,CY+R]){const dx=p.x-CX,dy=p.y-gy,d=Math.hypot(dx,dy);if(d<CREASE){const k=CREASE/(d||1);p.x=CX+dx*k;p.y=gy+dy*k;if(p===G.carrier&&p.team===0&&p.target)p.target=null;}}
    if(Math.abs(p.vx)>3)p.face=p.vx<0?1:0;
    if(!G.auto&&Math.hypot(p.vx,p.vy)>12&&Math.random()<dt*7)part({x:p.x-p.vx*0.28+rnd(-1,1),y:p.y-p.vy*0.28+rnd(-1,1),vx:rnd(-3,3),vy:-rnd(3,9),col:'rgba(235,252,255,0.9)',life:rnd(0.6,1.1),size:rnd(0.5,1.1),kind:'bub'});
    p.anim+=dt*(p.fx.sleep>0?0.6:(2.2+Math.hypot(p.vx,p.vy)*0.18));
  }
  const ps=G.players;
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<7&&d>0.01){const f=(7-d)/2,nx=dx/d,ny=dy/d;if(a!==c){a.x-=nx*f;a.y-=ny*f;}if(b!==c){b.x+=nx*f;b.y+=ny*f;}}}
}
// Where a pass to t will actually go. Live encounters and aiming freeze play, so the ball goes to the receiver's

const passTarget=(t,queued)=>queued&&t.run?{x:t.run.x,y:t.run.y}:t;

let buttons=[];

  else{let n=null,nd=999;for(const m of teamOf(0)){if(m.isGK)continue;const d=dist(m,q);if(d<nd){nd=d;n=m;}}if(n){n.run=q;n.runHold=0;}}
  if(st==='paused')refreshPlanOdds();
});

function updateCam(dt){
  const c=G.cam,inG=G.players.length&&!['title','howto','roster','quick','team','scout','season','club','gallery'].includes(G.state);let tx=CX,ty=CY,tz=FITZ;
  if(inG&&G.state!=='paused'&&G.state!=='half'&&G.state!=='final'){tz=G.flight&&G.flight.kind==='shot'&&!G.auto?1+0.55*clamp(G.flight.t/G.flight.dur*1.6,0,1):1;const b=G.flight?{x:G.flight.x,y:G.flight.y}:G.loose?{x:G.loose.x,y:G.loose.y}:(G.carrier||{x:CX,y:CY});tx=b.x;ty=b.y+(G.carrier&&G.carrier.team===0?-14:14);}
  const k=Math.min(1,dt*3.2);c.z+=(tz-c.z)*k;
  const hw=W/2/c.z,hh=(PANEL-15)/2/c.z,mx=Math.max(0,R+14-hw),my=Math.max(0,R+16-hh);
  c.x+=(clamp(tx,CX-mx,CX+mx)-c.x)*k;c.y+=(clamp(ty,CY-my,CY+my)-c.y)*k;

  if(st==='kickoff'){G.timer-=dt;if(G.timer<=0){G.state='play';G.banner=null;G.grace=2.2;sfx('whistle');}}
  else if(st==='play'){
    dt*=SAVE.pace;
    G.clock-=dt;G.grace=Math.max(0,(G.grace||0)-dt);
    for(const p of G.players)for(const k in p.cd)p.cd[k]=Math.max(0,p.cd[k]-dt);

    if(G.state==='play'&&G.loose){const L=G.loose;L.t+=dt;L.x+=L.vx*dt;L.y+=L.vy*dt;L.vx*=0.985;L.vy*=0.985;

      if(near.length){const q=near[0],ch=clamp(0.3+S(q,'cat')/32+rnd(-0.1,0.1),0.35,0.93);

        else{L.cool.set(q,0.7);const a=Math.random()*6.28;L.vx=Math.cos(a)*28;L.vy=Math.sin(a)*28;if(!G.auto)popup('BOBBLED',q.x,q.y-18,'#ffb36b',5.5);}}}
    if(G.state==='play'&&c){G.poss-=dt;if(G.poss<=0){const t=opp(c).filter(o=>!isOut(o)).sort((a,b)=>dist(a,c)-dist(b,c))[0];popup('SHOT CLOCK!',c.x,c.y-30,'#ff8a8a',8);sfx('whistle');if(c.team===0&&!G.auto)why('Shot clock ran out - you get '+SHOT_CLOCK+'s per possession','#ff8a8a');if(t){givePossession(t);t.immune=1.2;}c.stun=0.6;}}

  }
  else if(st==='aiEnc'){G.timer-=dt;if(G.timer<=0)execChoice(G.carrier,G.aiChoice,G.enc,G.homeTackle);}
  else if(st==='flight'){
    dt*=SAVE.pace;const f=G.flight;const slow=!G.auto&&!f.noslow&&f.kind==='shot'&&f.t/f.dur>0.4;if(slow&&!f.slowed){f.slowed=true;sfx('enc');}f.t+=dt*(slow?0.3:1);const k=Math.min(1,f.t/f.dur);

}

function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function raceFromName(name){const h=strHash(name||'X'),race=RACE_KEYS[h%6],fs=RACES[race].forms;return {race,form:fs[(h>>>4)%fs.length],sex:(h>>>9)%2?'f':'m'};}
function ensureRace(r){if(r&&!r.race)Object.assign(r,raceFromName(r.name));return r;}
function dress(p,r){const k=r&&r.race?r:raceFromName(p.name);p.race=k.race;p.form=k.form;p.sex=k.sex;const L=LOOK[p.form];if(L){p.skin=L.skin;p.hair=L.hair;}return p;}
function recAvatar(r){ensureRace(r);return dress({team:0,isGK:r.pos==='GK',skin:SKINS[r.skin],hair:HAIRS[r.hair],hs:r.hs,face:0,fx:{},name:r.name},r);}
const raceLabel=p=>p.form&&p.race&&p.race!=='human'&&p.race!=='synthari'?p.form+' ('+RACES[p.race].name+')':RACES[p.race||'human'].name;
// ---- drawing: everything below is in head-local units, facing right (r=3.7) ----

}
function rHead(col,w=1,snout=0,jaw=0){const r=3.7;ctx.beginPath();ctx.moveTo(-r*w,-0.4);ctx.ellipse(0,-0.4,r*w,r,0,Math.PI,0);

function drawRaceHead(x,y,p,sc,asleep){
  const f=p.face?-1:1,F=p.form,L=LOOK[F]||{},fem=p.sex==='f',t=G.time||0;

function drawHead(x,y,p,sc=1,asleep=false){
  if(p.race&&p.race!=='human'&&p.race!=='synthari'){drawRaceHead(x,y,p,sc,asleep);return;}
  const f=p.face?-1:1,r=3.7*sc;
  if(p.hs===2){ctx.beginPath();ctx.moveTo(x-f*2.4*sc,y-2*sc);ctx.quadraticCurveTo(x-f*6.2*sc,y-1*sc,x-f*5.4*sc,y+3*sc);ctx.quadraticCurveTo(x-f*4*sc,y+0.6*sc,x-f*2.6*sc,y+0.4*sc);ctx.closePath();ctx.fillStyle=p.hair;ctx.fill();ctx.lineWidth=0.8*sc;ctx.strokeStyle=OL;ctx.stroke();}
  // head: slightly longer jaw
  ctx.beginPath();ctx.moveTo(x-r,y-0.4*sc);ctx.arc(x,y-0.4*sc,r,Math.PI,0);ctx.quadraticCurveTo(x+r,y+3.2*sc,x+f*0.6*sc,y+3.9*sc);ctx.quadraticCurveTo(x-r,y+3.2*sc,x-r,y-0.4*sc);ctx.closePath();
  const gr=ctx.createLinearGradient(x-f*r,y-r,x+f*r,y+r);gr.addColorStop(0,shade(p.skin,1.12));gr.addColorStop(1,shade(p.skin,0.82));
  ctx.fillStyle=gr;ctx.fill();ctx.lineWidth=0.9*sc;ctx.strokeStyle=OL;ctx.stroke();
  // hair
  ctx.fillStyle=p.hair;ctx.beginPath();
  if(p.hs===1){ctx.moveTo(x-r-0.3*sc,y);ctx.lineTo(x-r*0.9,y-r*1.15);ctx.lineTo(x-r*0.25,y-r*1.05);ctx.lineTo(x+f*0.2*sc,y-r*1.6);ctx.lineTo(x+r*0.45,y-r*1.1);ctx.lineTo(x+f*r*1.45,y-r*1.25);ctx.lineTo(x+r*0.95,y-r*0.35);ctx.quadraticCurveTo(x,y-r*0.65,x-r-0.3*sc,y);}
  else{ctx.arc(x,y-0.5*sc,r+0.35*sc,Math.PI+0.05,-0.05);ctx.lineTo(x+f*(r+0.9*sc),y-r*0.25);ctx.quadraticCurveTo(x+f*r*0.2,y-r*0.95,x-f*(r+0.3*sc),y+0.6*sc);}
  ctx.closePath();ctx.fill();ctx.lineWidth=0.8*sc;ctx.strokeStyle=OL;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=0.5*sc;ctx.beginPath();ctx.arc(x-f*0.6*sc,y-1.2*sc,r*0.75,Math.PI*1.2,Math.PI*1.55);ctx.stroke();
  // eyes: narrow, determined, with brows

    if(G.cut){drawCut();ctx.fillStyle='#120e2b';ctx.fillRect(0,PANEL,W,H-PANEL);}else drawPanel();
    if(G.state==='paused'){txt('PLANNING',CX,34,8,'#7ff0e0');
      if(!G.quitAsk)btn(W-40,29,36,12,'✕ QUIT',()=>{G.quitAsk=true;},{col:'#7a3a4a',size:5});
      else{buttons=[];ctx.fillStyle='rgba(12,9,32,0.7)';ctx.fillRect(0,0,W,H);rrect(ctx,20,96,140,76,9);ctx.fillStyle='#1f1a48';ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#c0485e';ctx.stroke();
        txt('LEAVE THIS MATCH?',CX,110,9,'#ffffff');txt('It won\'t count. XP already earned',CX,124,5.4,'#cfe3ff','center',{stroke:false});txt('at halftime stays.',CX,132,5.4,'#cfe3ff','center',{stroke:false});
        btn(28,142,58,20,'LEAVE',()=>{G.quitAsk=false;G.cut=null;G.cuts=[];G.menu=null;G.state='title';sfx('whistle');},{col:'#c0485e',size:7});
        btn(94,142,58,20,'STAY',()=>{G.quitAsk=false;},{col:'#2fb36a',size:7});}}
    if(G.banner)banner(G.banner.t,G.banner.c,G.banner.sub);
    if(G.state==='tip'){buttons=[];const T=TIPS[G.tipKey];ctx.fillStyle='rgba(12,9,32,0.55)';ctx.fillRect(0,0,W,H);
      rrect(ctx,16,92,148,92,9);ctx.fillStyle='#1f1a48';ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#ffd24a';ctx.stroke();
      txt('COACH: '+T.t,CX,104,9,'#ffd24a');T.l.forEach((l,i)=>txt(l,CX,120+i*9.5,5.8,'#ffffff','center',{stroke:false}));
      btn(55,160,70,18,'GOT IT',()=>{SAVE.tips[G.tipKey]=true;persist();G.state=G.tipPrev;},{col:'#2fb36a',size:7});}
    if(G.state==='half'){buttons=[];drawHalf();}
    if(G.state==='final'){buttons=[];drawFinal();}
  }else{
    ({title:drawTitle,roster:drawRoster,quick:drawQuick,team:drawTeam,scout:drawScout,season:drawSeason,howto:drawHowTo,club:drawClub,gallery:drawGallery}[G.state]||drawTitle)();
    for(const p of G.popups){const a=Math.min(1,p.t*2);ctx.globalAlpha=a;txt(p.txt,p.x,p.y,p.size,p.col);ctx.globalAlpha=1;}
  }
}
let last=performance.now(),SPEED=1;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000)*SPEED;last=now;
  try{const steps=Math.ceil(dt/0.034);for(let i=0;i<steps;i++)update(dt/steps);render();}catch(err){console.error(err);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__SL={startAiEnc,G,setSpeed:s=>SPEED=s,setupMatch,update,kick:t=>kickoff(t),SAVE,MOVES,FX,buttons:()=>buttons,simShot,simPass,simBreak,odds,doBreak,doPass,doShot,landFlight,applyFx,engagedOf,aiTackleFor,defStopOdds,passTarget,passOddsMap,encounterCheck,givePossession,teamOf,gkOf,persist,render};
</script>
<button id="upd">New version available — tap to update</button>
<script>
if('serviceWorker' in navigator){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const show=w=>{const b=document.getElementById('upd');b.style.display='block';b.onclick=()=>w.postMessage('skipWaiting');};
      if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
      reg.addEventListener('updatefound',()=>{const w=reg.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w);});});
      setInterval(()=>reg.update(),30*60*1000);
    });
    let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!done){done=true;location.reload();}});
  });
}
</script>
