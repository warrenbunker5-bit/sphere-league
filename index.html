<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
// =================== CORE ===================
const W=180,H=320,CX=90,CY=150,R=126,PANEL=246,VX=90,VY=130.5,FITZ=Math.min(W,PANEL-15)/(2*R+18);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let K=1,bgCache=null;
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H),cw=Math.floor(W*s),ch=Math.floor(H*s);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const dpr=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);K=cv.width/W;bgCache=null;
}
addEventListener('resize',fit);fit();
const FONT='"Lilita One","Arial Black",Impact,sans-serif';
if(document.fonts&&document.fonts.load)document.fonts.load('10px "Lilita One"').then(()=>{bgCache=null;}).catch(()=>{});

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function shade(h,f){const c=hex2rgb(h).map(v=>f<1?v*f:v+(255-v)*(f-1));return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}
function alpha(h,a){const c=hex2rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(s,x,y,size,col,align='center',o={}){
  ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';s=String(s);
  if(o.stroke!==false){ctx.lineJoin='round';ctx.strokeStyle=o.sc||'#150f2e';ctx.lineWidth=size*(o.sw||0.3);ctx.strokeText(s,x,y+size*0.09);ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function ellipse(x,y,rx,ry,fill,stroke,lw){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}

// =================== SOUND ===================
let AC=null,muted=false,noiseBuf=null;
function sfx(type){
  if(muted)return;
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*0.5;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const tone=(f0,f1,dur,wave='square',vol=0.06,delay=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.setValueAtTime(f0,t+delay);o.frequency.exponentialRampToValueAtTime(f1,t+delay+dur);g.gain.setValueAtTime(vol,t+delay);g.gain.exponentialRampToValueAtTime(0.0001,t+delay+dur);o.connect(g);g.connect(AC.destination);o.start(t+delay);o.stop(t+delay+dur+0.02);};
    const noise=(dur,vol=0.08,freq=900)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur);};
    if(type==='blip')tone(660,700,0.05,'triangle',0.06);
    else if(type==='pass')tone(380,820,0.13,'triangle',0.09);
    else if(type==='shot'){tone(180,900,0.22,'sawtooth',0.04);noise(0.25,0.05,2000);}
    else if(type==='move'){tone(300,1400,0.3,'triangle',0.07);tone(600,1800,0.25,'sine',0.05,0.05);}
    else if(type==='tackle')noise(0.16,0.12,700);
    else if(type==='break')tone(300,1200,0.18,'triangle',0.06);
    else if(type==='enc'){tone(520,520,0.07,'square',0.04);tone(780,780,0.09,'square',0.04,0.08);}
    else if(type==='goal'){[523,659,784,1046].forEach((f,i)=>tone(f,f,0.18,'triangle',0.08,i*0.1));noise(1.2,0.06,1200);}
    else if(type==='save'){tone(400,200,0.2,'triangle',0.07);noise(0.2,0.06,500);}
    else if(type==='status'){tone(900,300,0.25,'sine',0.06);}
    else if(type==='whistle'){tone(1900,1700,0.35,'sine',0.07);}
    else if(type==='level'){[523,784,1046,1318].forEach((f,i)=>tone(f,f,0.14,'triangle',0.07,i*0.09));}
  }catch(e){}
}

// =================== MOVES ===================
const MOVES={
  viper:{name:'Viper Pass',type:'pass',cost:6,pow:3,fx:'poison',col:'#7fe04a',desc:'Poisons any defender who touches it'},
  lullaby:{name:'Lullaby Pass',type:'pass',cost:8,pow:2,fx:'sleep',col:'#b58cff',desc:'Defenders who touch it may fall asleep'},
  hex:{name:'Hex Pass',type:'pass',cost:6,pow:2,fx:'weak',col:'#ff6fcf',desc:'Cuts BLK and CAT of anyone it hits'},
  rocket:{name:'Rocket Pass',type:'pass',cost:5,pow:8,col:'#ffb13b',desc:'Huge boost to pass power'},
  curve:{name:'Curveball',type:'shot',cost:7,pow:2,special:'curve',col:'#5fd3ff',desc:'Bends around blockers in the lane'},
  toxic:{name:'Toxic Shot',type:'shot',cost:8,pow:3,fx:'poison',col:'#7fe04a',desc:'Poisons blockers and the keeper'},
  dream:{name:'Dream Shot',type:'shot',cost:9,pow:2,fx:'sleep',col:'#b58cff',desc:'Keeper who touches it may fall asleep'},
  avalanche:{name:'Avalanche Shot',type:'shot',cost:18,pow:8,special:'multi',col:'#dff4ff',desc:'Signature 3-hit power shot'},
  spin:{name:'Spin Cycle',type:'break',cost:5,pow:6,col:'#5fd3ff',desc:'Big ATK boost when breaking a tackle'},
  mirage:{name:'Mirage',type:'break',cost:8,pow:2,special:'mirage',col:'#ff6fcf',desc:'Only the first defender gets a tackle in'},
  sting:{name:'Sting Tackle',type:'tackle',cost:5,pow:2,fx:'poison',col:'#7fe04a',desc:'Poisons the ball carrier on contact'},
  anchor:{name:'Anchor Tackle',type:'tackle',cost:5,pow:2,fx:'slow',col:'#5fd3ff',desc:'Slows the ball carrier'},
  drain:{name:'Drain Tackle',type:'tackle',cost:4,pow:3,special:'drain',col:'#ff5a6e',desc:'Steals HP from the ball carrier'},
  sleeper:{name:'Sleeper Hold',type:'tackle',cost:8,pow:1,fx:'sleep',col:'#b58cff',desc:'Ball carrier may fall asleep'},
  wall:{name:'Iron Wall',type:'save',cost:8,pow:6,col:'#ffd24a',desc:'Keeper boosts CAT on shots (automatic)'}
};
const FX={poison:{dur:18,name:'POISON',col:'#7fe04a',desc:'loses HP every second - every stat drops'},sleep:{dur:7,name:'SLEEP',col:'#b58cff',chance:[0.6,0.75,0.9],desc:'can\'t move, block or tackle'},weak:{dur:16,name:'WEAK',col:'#ff6fcf',desc:'BLK and CAT cut almost in half'},slow:{dur:12,name:'SLOW',col:'#5fd3ff',desc:'swim speed cut in half'}};
const TYPE_LABEL={pass:'PASS',shot:'SHOT',break:'BREAK',tackle:'TACKLE',save:'KEEPER'};

// =================== SAVE ===================
const SAVE_KEY='sphereLeague.v1';
let SAVE={players:{}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.players)SAVE=s;}catch(e){}
SAVE.beaten=SAVE.beaten||{};SAVE.learned=SAVE.learned||{};SAVE.copyFails=SAVE.copyFails||{};SAVE.tips=SAVE.tips||{};
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}
function psave(name){return SAVE.players[name]||(SAVE.players[name]={xp:0,uses:{}});}
const lvlOf=xp=>Math.min(10,1+Math.floor(Math.sqrt(xp/80)));
const xpFor=l=>80*(l-1)*(l-1);

// =================== TEAMS ===================
const SKINS=['#f6d0ae','#e8b48a','#c98d60','#a46a42','#7d4c2c','#5e3820'];
const HAIRS=['#2a1a10','#6a3a18','#e0b85a','#18161c','#9a3f1d','#d9d9e0'];
const STAT_KEYS=['spd','end','atk','pas','blk','sht','cat'];
const TEAMS={
  riptide:{name:'Lakewood Riptide',short:'LKW',col:'#22b8a8',acc:'#f4f4ea',shorts:'#0e4f57',gk:'#f2c94c',
    roster:[
      ['NAVARRO','LF',[22,20,18,16,8,24,6],2,0,0,[['curve',1],['toxic',3],['avalanche',5]]],
      ['PIKE','RF',[24,18,16,18,8,21,6],0,2,1,[['spin',1],['dream',3],['mirage',4]]],
      ['BELL','MF',[20,24,18,24,14,14,8],4,3,2,[['viper',1],['rocket',2],['lullaby',3],['hex',5]]],
      ['OKAFOR','LD',[18,26,14,14,22,8,10],5,3,1,[['sting',1],['anchor',3]]],
      ['DUNBAR','RD',[17,28,16,12,24,7,10],1,5,0,[['drain',1],['sleeper',4]]],
      ['RUIZ','GK',[14,24,8,14,10,4,22],3,1,2,[['wall',1],['rocket',3]]]]},
  practice:{name:'Red Rocks Scrubs',short:'RRS',col:'#c2643a',acc:'#f4e3c8',shorts:'#5a2e1c',gk:'#a8b4c8',mult:0.72,tier:'PRACTICE',rank:1,ai:{chase:0.7,maxCh:1,think:1.5},xpMult:0.5,
    names:['DOYLE','PRATT','LUND','GREER','MOSS','TATE'],moves:[[],[],['viper'],['sting'],[],[]]},
  currents:{name:'Mile High Currents',short:'MHC',col:'#f07a2a',acc:'#1c2a52',shorts:'#1c2a52',gk:'#8fd14f',mult:0.85,tier:'ROOKIE',rank:1,ai:{chase:0.8,maxCh:1,think:1.1},
    names:['VOSS','KANE','ORTEGA','BRANT','HOLLIS','MARSH'],moves:[[],[],['rocket'],['drain'],[],[]]},
  breakers:{name:'Boulder Breakers',short:'BLD',col:'#e6be3a',acc:'#1b1b1b',shorts:'#2a2a2a',gk:'#4fc3f7',mult:0.98,tier:'PRO',rank:2,ai:{chase:0.9,maxCh:2,think:0.75},
    names:['STEELE','QUINN','DARBY','LOWRY','FINCH','CARSON'],moves:[['spin'],[],['hex'],[],['anchor'],['wall']]},
  undertow:{name:'Pikes Peak Undertow',short:'PPU',col:'#8b55d6',acc:'#d9dde8',shorts:'#3a2366',gk:'#ff6f61',mult:0.96,tier:'ALL-STAR',rank:3,ai:{chase:0.92,maxCh:2,think:0.7},
    names:['SABLE','KNOX','REYES','DRAKE','VANCE','HOLT'],moves:[['toxic'],['dream'],['viper','lullaby'],['sting'],['sleeper'],['wall']]}
};
const AWAY_BASE=[['LF',22,20,18,15,8,23,6],['RF',21,19,17,17,9,21,6],['MF',20,24,18,23,13,14,8],['LD',18,25,15,13,22,8,10],['RD',18,26,16,12,22,7,10],['GK',14,24,8,13,10,4,21]];
const FORM={LF:[-0.45,-0.42],RF:[0.45,-0.42],MF:[0,0.02],LD:[-0.42,0.42],RD:[0.42,0.42],GK:[0,0.86]};

// =================== STATE ===================
const G={cam:{x:CX,y:CY,z:FITZ},cut:null,cuts:[],state:'title',time:0,away:null,awayKey:null,players:[],carrier:null,flight:null,score:[0,0],half:1,clock:90,timer:0,popups:[],fxRings:[],
  queued:{pass:null,shot:false},enc:null,odds:null,party:0,bubbles:[],drag:null,steer:false,banner:null,menu:null,passMove:null,pickPass:false,shake:0,rosterSel:0,flash:null};
const HALF_LEN=120,SHOT_CLOCK=25,MERCY=5;
const goalTop={x:CX,y:CY-R+4},goalBot={x:CX,y:CY+R-4};
const attackGoal=t=>t===0?goalTop:goalBot;
const hpF=p=>0.5+0.5*p.hp/p.end;
function S(p,k){let v=p[k];if(p.fx.weak>0&&(k==='blk'||k==='cat'))v*=0.55;if(p.fx.slow>0&&k==='spd')v*=0.45;return v;}
const isOut=p=>p.stun>0||p.fx.sleep>0;
function rankOf(p,id){if(p.fixedRank)return p.fixedRank;const u=(p.uses&&p.uses[id])||0;return u>=8?3:u>=3?2:1;}
function powOf(p,id){if(!id)return 0;const m=MOVES[id];return m.pow+(rankOf(p,id)-1)*(m.special==='multi'?3:2);}
const canUse=(p,id)=>!id||(p.moves.includes(id)&&p.hp>=MOVES[id].cost&&!(p.cd[id]>0));
const cdFor=id=>{const m=MOVES[id];return m.special==='multi'?20:m.fx?12:6;};
const movesOfType=(p,t)=>p.moves.filter(id=>MOVES[id].type===t);

function makePlayer(team,name,pos,st,skin,hair,hs){
  const p={team,name,pos,isGK:pos==='GK',skin,hair,hs,x:CX,y:CY,vx:0,vy:0,face:team?1:0,anim:Math.random()*4,stun:0,immune:0,run:null,runHold:0,target:null,
    fx:{poison:0,sleep:0,weak:0,slow:0},moves:[],uses:{},cd:{},stats:{g:0,sh:0,pa:0,tk:0,br:0,sv:0,ic:0,as:0,pr:0}};
  STAT_KEYS.forEach((k,i)=>p[k]=st[i]);p.hp=p.end;return p;
}
function buildHome(){
  return TEAMS.riptide.roster.map(r=>{const p=makePlayer(0,r[0],r[1],r[2],SKINS[r[3]],HAIRS[r[4]],r[5]);const sv=psave(p.name);
    p.xp=sv.xp;p.level=lvlOf(sv.xp);p.uses=sv.uses;p.moveTable=r[6];p.moves=r[6].filter(m=>m[1]<=p.level).map(m=>m[0]);
    p.learned=(SAVE.learned[p.name]||[]);p.learned.forEach(id=>{if(!p.moves.includes(id))p.moves.push(id);});return p;});
}
function setupMatch(key){
  const away=TEAMS[key];G.away=away;G.awayKey=key;
  G.players=buildHome();
  AWAY_BASE.forEach((r,i)=>{const st=r.slice(1).map(v=>Math.round(v*away.mult+rnd(-1.5,1.5)));const p=makePlayer(1,away.names[i],r[0],st,SKINS[(i*2+key.length)%6],HAIRS[(i+key.length)%6],(i+key.length)%3);p.moves=away.moves[i].slice();p.fixedRank=away.rank;G.players.push(p);});
  G.score=[0,0];G.half=1;G.clock=HALF_LEN;G.mercy=false;G.copied=[];G.why=null;G.lastPasser=null;G.poss=SHOT_CLOCK;G.popups=[];G.fxRings=[];G.flight=null;G.party=0;G.menu=null;bgCache=null;
  kickoff(0);
}
const teamOf=t=>G.players.filter(p=>p.team===t);
const opp=p=>G.players.filter(q=>q.team!==p.team);
const gkOf=t=>G.players.find(p=>p.team===t&&p.isGK);
function clampSphere(x,y,m){const dx=x-CX,dy=y-CY,d=Math.hypot(dx,dy),lim=R-m;if(d>lim){x=CX+dx/d*lim;y=CY+dy/d*lim;}return {x,y};}
function spot(p,hasBall,kick){
  if(p.isGK){const bx=G.carrier?G.carrier.x:CX;return {x:CX+clamp(bx-CX,-24,24)*0.7,y:p.team===0?CY+R-13:CY-R+13};}
  const [fx,fy]=FORM[p.pos];const dir=p.team===0?1:-1;let ox=fx*dir,oy=fy*dir;
  oy+=(hasBall?-0.3:0.14)*dir;if(kick)oy+=0.22*dir;
  ox+=(G.carrier?(G.carrier.x-CX)/R:0)*0.3;
  const wob=hasBall?Math.sin(G.time*0.7+p.anim)*0.06:0;
  return clampSphere(CX+(ox+wob)*R*0.82,CY+oy*R*0.82,9);
}
function kickoff(team){
  G.carrier=null;
  for(const p of G.players){const s=spot(p,false,true);p.x=s.x;p.y=s.y;p.vx=p.vy=0;p.run=null;p.target=null;p.stun=0;p.immune=0;p.fx.sleep=0;}
  const mf=G.players.find(p=>p.team===team&&p.pos==='MF');mf.x=CX;mf.y=CY+(team===0?10:-10);
  givePossession(mf);mf.immune=1.6;
  G.state='kickoff';G.timer=1.4;G.banner={t:'KICKOFF',c:'#ffffff'};
}
function givePossession(p){if(!G.carrier||G.carrier.team!==p.team)G.poss=SHOT_CLOCK;G.carrier=p;p.immune=Math.max(p.immune,0.8);p.target=null;p.run=null;G.queued={pass:null,shot:false};p.think=0.6;p.hold=0;}
function popup(txt,x,y,col='#ffffff',size=7){G.popups.push({txt,x,y,col,t:1.4,size});}

// =================== MOVE USE & EFFECTS ===================
function useMove(p,id){
  if(!id)return;const m=MOVES[id];p.hp=Math.max(0,p.hp-m.cost);p.cd[id]=cdFor(id);
  if(p.team===1&&!G.auto)tryCopy(p,id);
  if(p.team===0){p.uses[id]=(p.uses[id]||0)+1;const r0=p.uses[id]===3||p.uses[id]===8;if(r0)popup(m.name.toUpperCase()+' RANK UP!',p.x,p.y-30,'#ffd24a',6);persist();}
  popup(m.name.toUpperCase()+'!',p.x,p.y-22,m.col,8);
  G.flash={col:m.col,t:0.35};sfx('move');pushCut({k:'move',p,id,dur:1.3});
  G.fxRings.push({x:p.x,y:p.y,col:m.col,t:0.6});
}
const COPY_ROLES={pass:['LF','RF','MF','LD','RD'],break:['LF','RF','MF','LD','RD'],shot:['LF','RF','MF'],tackle:['MF','LD','RD'],save:['GK']};
function tryCopy(user,id){
  const m=MOVES[id];const cands=teamOf(0).filter(h=>COPY_ROLES[m.type].includes(h.pos)&&!h.moves.includes(id)&&dist(h,user)<45).sort((a,b)=>dist(a,user)-dist(b,user));
  const h=cands[0];if(!h)return;
  const key=h.name+':'+id,fails=SAVE.copyFails[key]||0,ch=Math.min(1,0.2+fails*0.2);
  if(Math.random()<ch){(SAVE.learned[h.name]=SAVE.learned[h.name]||[]).push(id);h.moves.push(id);delete SAVE.copyFails[key];persist();
    G.copied=G.copied||[];G.copied.push({p:h,id});
    setTimeout(()=>{popup(h.name+' COPIED '+m.name.toUpperCase()+'!',h.x,h.y-30,'#ffd24a',7);sfx('level');},400);}
  else{SAVE.copyFails[key]=fails+1;persist();popup('STUDYING '+Math.round(Math.min(1,ch+0.2)*100)+'%',h.x,h.y-20,'#cfe3ff',5);}
}
function applyFx(list,owner,id){
  const m=MOVES[id];if(!m||!m.fx)return;const r=rankOf(owner,id);const seen=new Set(),hit=[];
  for(const t of list){if(!t||seen.has(t)||t.team===owner.team)continue;seen.add(t);
    if(m.fx==='sleep'&&Math.random()>FX.sleep.chance[r-1]){popup('RESISTED',t.x,t.y-14,'#cfe3ff',6);continue;}
    t.fx[m.fx]=FX[m.fx].dur*(1+0.25*(r-1));popup(FX[m.fx].name,t.x,t.y-14,FX[m.fx].col,7);sfx('status');
    G.fxRings.push({x:t.x,y:t.y,col:FX[m.fx].col,t:0.5});hit.push(t);}
  if(hit.length){pushCut({k:'status',fx:m.fx,list:hit,dur:1.3});if(!G.auto)why(hit.map(h=>h.name).join(', ')+' '+FX[m.fx].name+': '+FX[m.fx].desc,FX[m.fx].col);}
}

// =================== RESOLUTION ===================
function segInfo(a,b,p){const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;const t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;return {t,d:Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t))};}
function lineBlockers(a,b,team,engaged,width){
  return G.players.filter(o=>o.team!==team&&!isOut(o)&&!engaged.includes(o)&&!o.isGK).map(o=>({o,...segInfo(a,b,o)})).filter(k=>k.t>0.12&&k.t<0.96&&k.d<width).sort((x,y)=>x.t-y.t);
}
function simBreak(c,defs,mv,tk){
  const atk=(S(c,'atk')+powOf(c,mv))*rnd(0.85,1.15)*hpF(c);
  let s=[...defs].sort((a,b)=>S(b,'blk')-S(a,'blk'));if(mv&&MOVES[mv].special==='mirage')s=s.slice(0,1);
  let def=0;s.forEach((d,i)=>{let b=S(d,'blk');if(tk&&tk.p===d)b+=powOf(d,tk.id);def+=b*rnd(0.85,1.15)*(i?0.45:1)*hpF(d);});
  return {ok:atk>def,atk,def,top:s[0]};
}
function simPass(c,to,engaged,mv){
  let s=(S(c,'pas')+powOf(c,mv))*rnd(0.9,1.1)*hpF(c)-dist(c,to)*0.08;const first=s,touched=[];
  for(const d of engaged){touched.push(d);s-=S(d,'blk')*rnd(0.85,1.15)*0.4*hpF(d);if(s<=0)return {ok:false,by:d,first,touched};}
  for(const k of lineBlockers(c,to,c.team,engaged,7)){touched.push(k.o);s-=S(k.o,'blk')*rnd(0.85,1.15)*0.6*hpF(k.o);if(s<=0)return {ok:false,by:k.o,first,touched};}
  for(const m of G.players){if(m.team===c.team||isOut(m)||m.isGK||engaged.includes(m)||Math.hypot(m.x-to.x,m.y-to.y)>=9)continue;touched.push(m);s-=S(m,'blk')*rnd(0.7,1.1)*0.4*hpF(m);if(s<=0)return {ok:false,by:m,first,touched};}
  return {ok:true,first,touched};
}
const gkWall=gk=>gk.moves.includes('wall')&&gk.hp>=MOVES.wall.cost;
function simShot(c,engaged,mv){
  const m=mv?MOVES[mv]:null,g=attackGoal(c.team);
  let s=(S(c,'sht')+powOf(c,mv))*rnd(0.9,1.1)*hpF(c)-dist(c,g)*0.13;const first=s,touched=[];
  const ef=m&&m.special==='multi'?0.25:0.4;
  for(const d of engaged){touched.push(d);s-=S(d,'blk')*rnd(0.85,1.15)*ef*hpF(d);if(s<=0)return {ok:false,by:d,first,blocked:true,touched};}
  if(!(m&&m.special==='curve'))for(const k of lineBlockers(c,g,c.team,engaged,6)){touched.push(k.o);s-=S(k.o,'blk')*rnd(0.85,1.15)*0.5*hpF(k.o);if(s<=0)return {ok:false,by:k.o,first,blocked:true,touched};}
  const gk=gkOf(1-c.team);touched.push(gk);
  if(isOut(gk)){const gv=S(gk,'cat')*0.3*rnd(0.7,1.1);return {ok:s>gv,by:gk,first,s:Math.max(0,s),gv,touched,asleep:true};}
  const wall=gkWall(gk);const gv=(S(gk,'cat')+(wall?powOf(gk,'wall'):0))*rnd(0.85,1.25)*hpF(gk);
  return {ok:s>gv,by:gk,first,s:Math.max(0,s),gv,touched,wall};
}
function odds(fn,n=100){let k=0;for(let i=0;i<n;i++)if(fn().ok)k++;return k/n;}
const pct=v=>Math.round(v*100)+'%';
const engagedOf=c=>opp(c).filter(o=>!isOut(o)&&dist(o,c)<16);
const shotRange=c=>dist(c,attackGoal(c.team))<112;

function why(t,col){G.why={t,col:col||'#ffe066',life:4.5};}
function doBreak(c,engaged,mv,tk){
  if(mv)useMove(c,mv);if(tk&&tk.id)useMove(tk.p,tk.id);
  const r=simBreak(c,engaged,mv,tk);
  popup('ATK '+Math.round(r.atk),c.x,c.y-14,'#ffe066');popup('BLK '+Math.round(r.def),r.top.x,r.top.y-6,'#ff8a8a');
  c.hp=Math.max(0,c.hp-r.def*0.4);engaged.forEach(d=>d.hp=Math.max(0,d.hp-r.atk*0.2));
  if(tk&&tk.id){const tm=MOVES[tk.id];if(tm.special==='drain'){const amt=6+rankOf(tk.p,tk.id)*3;c.hp=Math.max(0,c.hp-amt);tk.p.hp=Math.min(tk.p.end,tk.p.hp+amt);popup('-'+amt+' HP',c.x,c.y-6,'#ff5a6e');}else applyFx([c],tk.p,tk.id);}
  if(c.team===0&&!G.auto)why(r.ok?'Broke through: your ATK '+Math.round(r.atk)+' beat BLK '+Math.round(r.def):'Tackled: BLK '+Math.round(r.def)+' beat your ATK '+Math.round(r.atk)+(engaged.length>1?' - pass when outnumbered':''),r.ok?'#7dffb0':'#ff8a8a');
  else if(c.team===1&&!G.auto)why(r.ok?'They broke your tackle: ATK '+Math.round(r.atk)+' vs BLK '+Math.round(r.def):'Your tackle won: BLK '+Math.round(r.def)+' vs ATK '+Math.round(r.atk),r.ok?'#ff8a8a':'#7dffb0');
  teamOf(0).forEach(h=>{if(engaged.includes(h))h.stats.pr++;});
  if(r.ok){c.stats.br++;engaged.forEach(d=>{d.stun=1.4;d.vx*=-0.5;d.vy*=-0.5;});c.immune=1.3;popup('BREAK!',c.x,c.y-30,'#7dffb0',8);sfx('break');
    const g=attackGoal(c.team),dx=g.x-c.x,dy=g.y-c.y,dd=Math.hypot(dx,dy)||1;c.vx=dx/dd*45;c.vy=dy/dd*45;}
  else{r.top.stats.tk++;c.stun=1.1;popup('TACKLED',c.x,c.y-30,'#ff6b6b',8);sfx('tackle');givePossession(r.top);r.top.immune=1.2;G.shake=0.25;}
  G.state='play';G.enc=null;G.menu=null;
}
function launch(kind,c,tgt,result,speed,mv){
  const bx=c.x+(c.face?-5:5),by=c.y+1;
  G.flight={kind,from:c,x0:bx,y0:by,tgt,result,t:0,dur:Math.max(0.28,Math.hypot(tgt.x-bx,tgt.y-by)/speed),x:bx,y:by,mv,trail:[]};
  G.carrier=null;G.state='flight';G.enc=null;G.menu=null;G.queued={pass:null,shot:false};G.pickPass=false;G.passMove=null;
}
function doPass(c,to,engaged,mv){
  if(mv)useMove(c,mv);
  const r=simPass(c,to,engaged,mv);popup('PAS '+Math.round(r.first),c.x,c.y-14,'#ffe066');sfx('pass');
  launch('pass',c,r.ok?to:r.by,r,mv?140:122,mv);
}
function doShot(c,engaged,mv){
  if(mv)useMove(c,mv);
  const r=simShot(c,engaged,mv);c.stats.sh++;popup('SHT '+Math.round(r.first),c.x,c.y-14,'#ffe066');sfx('shot');
  const g=attackGoal(c.team);
  const tgt=r.ok?{x:g.x+rnd(-7,7),y:g.y+(c.team===0?-5:5)}:r.by;
  launch('shot',c,tgt,r,mv?200:170,mv);
}
function landFlight(){
  const f=G.flight,r=f.result,c=f.from;G.flight=null;
  if(f.mv)applyFx(r.touched||[],c,f.mv);
  if(f.kind==='pass'){
    if(c.team===0&&!G.auto)why(r.ok?'Pass connected':'Picked off by '+r.by.name+' (BLK '+S(r.by,'blk')+') - try a closer mate or a pass move',r.ok?'#7dffb0':'#ff8a8a');
    if(r.ok){c.stats.pa++;G.lastPasser=c;givePossession(f.tgt);f.tgt.immune=0.7;sfx('blip');}
    else{r.by.stats.ic++;popup('INTERCEPT',r.by.x,r.by.y-22,'#ff8a8a');givePossession(r.by);r.by.immune=1;sfx('tackle');}
    G.state='play';
  }else{
    if(r.wall&&!r.asleep)useMove(r.by,'wall');
    if(r.ok){
      G.score[c.team]++;c.stats.g++;if(G.lastPasser&&G.lastPasser!==c&&G.lastPasser.team===c.team)G.lastPasser.stats.as++;G.lastPasser=null;
      if(c.team===0&&!G.auto)why('GOAL! Your SHT '+Math.round(r.first)+' beat the keeper\'s '+Math.round(r.gv),'#7dffb0');G.state='goal';G.timer=2.6;G.party=c.team===0?2.6:0;G.shake=0.4;G.lastScorer=c;
      G.banner={t:'GOAL!',c:c.team===0?TEAMS.riptide.col:G.away.col,sub:c.name};sfx('goal');
      for(let i=0;i<40;i++)G.bubbles.push({x:f.tgt.x+rnd(-8,8),y:f.tgt.y+rnd(-3,3),vy:rnd(-30,30),vx:rnd(-30,30),s:rnd(0.6,1.8),life:rnd(0.8,1.6)});
    }else{
      if(c.team===0&&!G.auto)why(r.blocked?'Blocked by '+r.by.name+' - shoot from a clearer lane or use Curveball':'Saved: keeper CAT '+Math.round(r.gv)+' beat your '+Math.round(r.s)+' - get closer or use a shot move','#ff8a8a');
      const by=r.by;if(r.blocked){by.stats.ic++;popup('BLOCKED',by.x,by.y-22,'#ff8a8a',8);}else{by.stats.sv++;popup('CAT '+Math.round(r.gv),by.x,by.y-14,'#ff8a8a');popup('SAVE!',by.x,by.y-30,'#ffffff',8);}
      sfx('save');givePossession(by);by.immune=1.2;G.state='play';

}
function endPeriod(){

  else{G.state='final';G.banner=null;finishMatch();}
}
function finishMatch(){
  const win=G.score[0]>G.score[1];G.levelUps=[];G.unlocked=null;
  if(win&&!SAVE.beaten[G.awayKey]){SAVE.beaten[G.awayKey]=true;const nx=LADDER[LADDER.indexOf(G.awayKey)+1];if(nx&&G.awayKey!=='practice')G.unlocked=TEAMS[nx].name;}
  const xm=G.away.xpMult||1;
  for(const p of teamOf(0)){
    const s=p.stats;p.xpGain=Math.round((10+s.g*30+s.as*12+s.sh*4+s.pa*5+s.tk*10+s.br*6+s.sv*8+s.ic*10+s.pr*3+G.score[0]*4+(win?20:0))*xm);
    const sv=psave(p.name);const before=lvlOf(sv.xp);sv.xp+=p.xpGain;const after=lvlOf(sv.xp);
    if(after>before){const nm=p.moveTable.filter(m=>m[1]>before&&m[1]<=after).map(m=>MOVES[m[0]].name);G.levelUps.push({p,lv:after,moves:nm});}
  }
  persist();G.mvp=teamOf(0).reduce((a,b)=>b.xpGain>a.xpGain?b:a);
  if(G.levelUps.length)setTimeout(()=>sfx('level'),500);
}

const TIPS={
  start:{t:'YOUR BALL',l:['Tap the water to swim there.','Tap a teammate to pass, tap the','goal at the top to shoot.','You have 25 seconds per possession.']},
  encounter:{t:'ENCOUNTER!',l:['A defender reached you. The odds','are on each button - green is good.','Outnumbered? Passing usually','beats trying to break through.']},
  defend:{t:'DEFENDING',l:['Your defenders chase on their own.','Tap water to send the nearest one','there, or Pause + Plan to set','up a wall in front of your goal.']}};
function showTip(k){if(G.auto||SAVE.tips[k]||!TIPS[k])return;G.tipPrev=G.state;G.tipKey=k;G.state='tip';}
const LADDER=['practice','currents','breakers','undertow'];
const unlockedTeam=k=>k==='practice'||k==='currents'||SAVE.beaten[LADDER[LADDER.indexOf(k)-1]];
function encounterCheck(){
  const c=G.carrier;if(!c||c.immune>0)return;
  const close=opp(c).filter(o=>!isOut(o)&&dist(o,c)<9);if(!close.length)return;
  const engaged=engagedOf(c);
  if(c.team===0&&!G.auto){
    G.state='encounter';G.enc=engaged;G.menu=null;G.pickPass=false;G.passMove=null;sfx('enc');pushCut({k:'enc',a:c,d:[...engaged].sort((a,b)=>S(b,'blk')-S(a,'blk')),dur:1.0});showTip('encounter');
    G.aiTackle=aiTackleFor(engaged);
    G.odds={brk:odds(()=>simBreak(c,engaged,null,G.aiTackle)),shot:shotRange(c)?odds(()=>simShot(c,engaged)):null,pass:passOddsMap(c,engaged,null)};
  }else if(c.team===1){
    const lead=engaged.filter(e=>e.team===0).sort((a,b)=>dist(a,c)-dist(b,c))[0];
    G.enc=engaged;G.defLead=lead;pushCut({k:'enc',a:c,d:lead?[lead,...engaged.filter(e=>e!==lead)]:engaged,dur:0.9});
    const tackles=lead?movesOfType(lead,'tackle').filter(id=>canUse(lead,id)):[];
    if(!G.auto&&tackles.length){G.state='defEnc';sfx('enc');}
    else{let tk=null;if(G.auto&&tackles.length&&Math.random()<0.6)tk={p:lead,id:tackles[0]};startAiEnc(tk);}
  }else{
    const tk=aiTackleFor(engaged);const ch=aiChoose(c,engaged,tk);execChoice(c,ch,engaged,tk);
  }
}
function aiTackleFor(engaged){
  const lead=[...engaged].sort((a,b)=>S(b,'blk')-S(a,'blk'))[0];if(!lead)return null;
  const t=movesOfType(lead,'tackle').filter(id=>canUse(lead,id));
  return t.length&&Math.random()<0.7?{p:lead,id:t[(Math.random()*t.length)|0]}:null;
}
function startAiEnc(tk){
  const c=G.carrier;G.homeTackle=tk;const ch=aiChoose(c,G.enc,tk);G.aiChoice=ch;G.state='aiEnc';G.timer=0.75;
  popup(ch.label,c.x,c.y-30,'#ffb36b',8);if(!G.auto)sfx('enc');
}
function execChoice(c,ch,en,tk){if(ch.k==='break')doBreak(c,en,ch.mv,tk);else if(ch.k==='shot')doShot(c,en,ch.mv);else doPass(c,ch.m,en,ch.mv);}
function aiChoose(c,engaged,tk){
  const g=attackGoal(c.team),dg=dist(c,g),opts=[];
  for(const mv of [null,...movesOfType(c,'break').filter(id=>canUse(c,id)&&c.hp>MOVES[id].cost+4)])opts.push({k:'break',mv,v:odds(()=>simBreak(c,engaged,mv,tk),40),label:mv?MOVES[mv].name.toUpperCase():'BREAK!'});
  if(dg<105)for(const mv of [null,...movesOfType(c,'shot').filter(id=>canUse(c,id))]){const o=odds(()=>simShot(c,engaged,mv),40);opts.push({k:'shot',mv,v:o*(dg<70?1.6:0.9)+(mv&&MOVES[mv].fx?0.05:0),label:mv?MOVES[mv].name.toUpperCase():'SHOOT!'});}
  const pm=movesOfType(c,'pass').filter(id=>canUse(c,id));
  for(const m of teamOf(c.team)){if(m===c||m.isGK)continue;const prog=(dg-dist(m,g))/80;
    for(const mv of [null,pm.length&&Math.random()<0.6?pm[(Math.random()*pm.length)|0]:null]){if(mv===null&&opts.some(o=>o.m===m&&o.mv===null))continue;const o=odds(()=>simPass(c,m,engaged,mv),30);opts.push({k:'pass',m,mv,v:o*0.85+prog*0.25+(mv&&MOVES[mv].fx?0.06:0),label:mv?MOVES[mv].name.toUpperCase():'PASS!'});}}
  opts.sort((a,b)=>b.v-a.v);return opts[0];
}
function aiCarrier(c,dt){
  const g=attackGoal(c.team),dg=dist(c,g);
  const press=Math.min(99,...opp(c).map(o=>isOut(o)?99:dist(o,c)));
  c.think-=dt;
  if(c.isGK){c.hold+=dt;c.target={x:c.x,y:c.y};if(c.hold>0.9){let best=null,bv=-1;for(const m of teamOf(c.team)){if(m===c)continue;const o=odds(()=>simPass(c,m,[]),30);if(o>bv){bv=o;best=m;}}doPass(c,best,[],null);}return;}
  if(c.isGK)return;
  if(c.think<=0){
    c.think=(c.team===1?G.away.ai.think:0.6)*(0.8+Math.random()*0.5);
    if(dg<76&&press>14&&Math.random()<0.75){const sm=movesOfType(c,'shot').filter(id=>canUse(c,id));doShot(c,[],sm.length&&Math.random()<0.6?sm[0]:null);return;}
    if(press<45){for(const m of teamOf(c.team)){if(m===c||m.isGK)continue;if(dist(m,g)<dg-18){const o=odds(()=>simPass(c,m,[]),30);if(o>0.7&&Math.random()<0.75){const pm=movesOfType(c,'pass').filter(id=>canUse(c,id));doPass(c,m,[],pm.length&&Math.random()<0.4?pm[0]:null);return;}}}}
  }
  let vx=(g.x-c.x)/(dg||1),vy=(g.y-c.y)/(dg||1);
  for(const o of opp(c)){const d=dist(o,c);if(d<32&&d>0.1){const f=(32-d)/32*1.3;vx+=(c.x-o.x)/d*f;vy+=(c.y-o.y)/d*f;}}
  c.target={x:c.x+vx*20,y:c.y+vy*20};
}
function updatePlayers(dt){
  const c=G.carrier;
  const maxCh=c?Math.min(c.team===0?G.away.ai.maxCh:2,dist(c,attackGoal(c.team))<95?2:1):0;
  const chasers=c&&!(c.team===0&&G.grace>0)?opp(c).filter(p=>!p.isGK&&!isOut(p)&&dist(p,c)<85).sort((a,b)=>dist(a,c)-dist(b,c)).slice(0,maxCh):[];
  for(const p of G.players){
    p.stun=Math.max(0,p.stun-dt);p.immune=Math.max(0,p.immune-dt);
    for(const k in p.fx)p.fx[k]=Math.max(0,p.fx[k]-dt);
    if(p.fx.poison>0){p.hp=Math.max(0,p.hp-dt*2.4);p.ptick=(p.ptick||0)+dt;if(p.ptick>2){p.ptick=0;if(!G.auto)popup('-5',p.x+4,p.y-8,'#7fe04a',5);}}else p.hp=Math.min(p.end,p.hp+dt*0.5);
    let T=null,sf=1;const hasBall=c&&c.team===p.team;
    if(p===c){
      if(p.team===1||G.auto)aiCarrier(p,dt);
      if(G.carrier!==p)continue;
      T=p.target;sf=0.9;if(T&&dist(p,T)<2&&p.team===0)p.target=null;
    }else if(p.run){T=p.run;sf=1.05;if(dist(p,p.run)<3){p.runHold+=dt;if(p.runHold>(hasBall?1.8:1.4)){p.run=null;p.runHold=0;}}}
    else if(c&&!hasBall&&chasers.includes(p)){T={x:c.x+c.vx*0.35,y:c.y+c.vy*0.35};sf=p.team===1?G.away.ai.chase:0.97;}
    else{
      const s=spot(p,hasBall);T=s;
      if(c&&!hasBall&&!p.isGK){const own=attackGoal(1-p.team);let near=null,nd=99;for(const a of teamOf(c.team)){if(a===c||a.isGK)continue;const d=dist(a,s);if(d<nd){nd=d;near=a;}}
        if(near&&nd<40)T={x:near.x*0.6+own.x*0.1+s.x*0.3,y:near.y*0.6+own.y*0.1+s.y*0.3};}
      if(hasBall&&p.team===0&&!p.isGK){let nd=99,no=null;for(const o of opp(p)){const d=dist(o,T);if(d<nd){nd=d;no=o;}}if(no&&nd<22&&nd>0.1){const k=(22-nd)*0.9;T=clampSphere(T.x+(T.x-no.x)/nd*k,T.y+(T.y-no.y)/nd*k,9);}}
      sf=0.85;
    }
    if(p.fx.sleep>0)T=null;
    let dvx=0,dvy=0;
    if(T){const dx=T.x-p.x,dy=T.y-p.y,d=Math.hypot(dx,dy);if(d>0.8){const sp=(10+S(p,'spd')*0.62)*sf*(p.stun>0?0.25:1)*(0.75+0.25*p.hp/p.end)*Math.min(1,d/8);dvx=dx/d*sp;dvy=dy/d*sp;}}
    const k=Math.min(1,dt*3.2);p.vx+=(dvx-p.vx)*k;p.vy+=(dvy-p.vy)*k;
    p.x+=p.vx*dt;p.y+=p.vy*dt;const s=clampSphere(p.x,p.y,p.isGK?6:7);p.x=s.x;p.y=s.y;
    if(Math.abs(p.vx)>3)p.face=p.vx<0?1:0;
    p.anim+=dt*(p.fx.sleep>0?0.6:(2.2+Math.hypot(p.vx,p.vy)*0.18));
  }
  const ps=G.players;
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<7&&d>0.01){const f=(7-d)/2,nx=dx/d,ny=dy/d;if(a!==c){a.x-=nx*f;a.y-=ny*f;}if(b!==c){b.x+=nx*f;b.y+=ny*f;}}}
}
function passOddsMap(c,engaged,mv){const m=new Map();teamOf(c.team).forEach(t=>{if(t!==c){const tgt=t.run?{x:t.run.x,y:t.run.y}:t;m.set(t,odds(()=>simPass(c,tgt,engaged,mv),60));}});return m;}

function toGame(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}

const inSphere=pt=>Math.hypot(pt.x-CX,pt.y-CY)<R+4;

// =================== UPDATE ===================
function s2w(pt){const c=G.cam;return {x:(pt.x-VX)/c.z+c.x,y:(pt.y-VY)/c.z+c.y};}
function w2s(pt){const c=G.cam;return {x:(pt.x-c.x)*c.z+VX,y:(pt.y-c.y)*c.z+VY};}
function updateCam(dt){
  const c=G.cam,inG=G.players.length&&!['title','howto','roster'].includes(G.state);let tx=CX,ty=CY,tz=FITZ;
  if(inG&&G.state!=='paused'&&G.state!=='half'&&G.state!=='final'){tz=1;const b=G.flight?{x:G.flight.x,y:G.flight.y}:(G.carrier||{x:CX,y:CY});tx=b.x;ty=b.y+(G.carrier&&G.carrier.team===0?-14:14);}
  const k=Math.min(1,dt*3.2);c.z+=(tz-c.z)*k;
  const hw=W/2/c.z,hh=(PANEL-15)/2/c.z,mx=Math.max(0,R+14-hw),my=Math.max(0,R+16-hh);
  c.x+=(clamp(tx,CX-mx,CX+mx)-c.x)*k;c.y+=(clamp(ty,CY-my,CY+my)-c.y)*k;
  c.x=clamp(c.x,CX-mx,CX+mx);c.y=clamp(c.y,CY-my,CY+my);
}
function update(dt){
  updateCam(dt);
  if(G.cut){G.cut.t+=dt;if(G.cut.t>=G.cut.dur)G.cut=G.cuts.shift()||null;return;}
  G.time+=dt;G.shake=Math.max(0,G.shake-dt);G.party=Math.max(0,G.party-dt);
  if(G.why){G.why.life-=dt;if(G.why.life<=0)G.why=null;}
  if(G.state==='tip')return;
  if(G.flash){G.flash.t-=dt;if(G.flash.t<=0)G.flash=null;}
  for(const p of G.popups){p.t-=dt;p.y-=dt*9;}G.popups=G.popups.filter(p=>p.t>0);
  for(const r of G.fxRings)r.t-=dt;G.fxRings=G.fxRings.filter(r=>r.t>0);
  if(Math.random()<dt*7){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*R*0.9;G.bubbles.push({x:CX+Math.cos(a)*r,y:CY+R*0.55+Math.random()*R*0.3,vy:-rnd(6,16),vx:0,s:rnd(0.5,1.5),life:rnd(3,7)});}
  for(const b of G.bubbles){b.life-=dt;b.y+=b.vy*dt;b.x+=b.vx*dt+Math.sin(G.time*3+b.y*0.2)*dt*4;b.vx*=0.95;b.vy=b.vy*0.98-dt*4;}
  G.bubbles=G.bubbles.filter(b=>b.life>0&&Math.hypot(b.x-CX,b.y-CY)<R-1);
  const st=G.state;
  if(st==='kickoff'){G.timer-=dt;if(G.timer<=0){G.state='play';G.banner=null;G.grace=2.2;sfx('whistle');}}
  else if(st==='play'){
    G.clock-=dt;G.grace=Math.max(0,(G.grace||0)-dt);
    for(const p of G.players)for(const k in p.cd)p.cd[k]=Math.max(0,p.cd[k]-dt);
    updatePlayers(dt);const c=G.carrier;
    if(G.state==='play'&&c){G.poss-=dt;if(G.poss<=0){const t=opp(c).filter(o=>!isOut(o)).sort((a,b)=>dist(a,c)-dist(b,c))[0];popup('SHOT CLOCK!',c.x,c.y-30,'#ff8a8a',8);sfx('whistle');if(c.team===0&&!G.auto)why('Shot clock ran out - you get '+SHOT_CLOCK+'s per possession','#ff8a8a');if(t){givePossession(t);t.immune=1.2;}c.stun=0.6;}}
    if(G.state==='play'&&c&&c.team===0&&!G.auto)showTip('start');
    if(G.state==='play'&&c&&c.team===1&&!G.auto)showTip('defend');
    if(G.state==='play'&&c&&c.team===0&&!G.auto){
      if(G.queued.shot)doShot(c,[],null);
      else if(G.queued.pass){const q=G.queued.pass;q.t+=dt;if(!q.p.run||dist(q.p,q.p.run)<6||q.t>3)doPass(c,q.p,[],canUse(c,q.mv)?q.mv:null);}
    }
    if(G.state==='play')encounterCheck();
    if(G.state==='play'&&G.clock<=0){G.clock=0;endPeriod();}
  }
  else if(st==='aiEnc'){G.timer-=dt;if(G.timer<=0)execChoice(G.carrier,G.aiChoice,G.enc,G.homeTackle);}
  else if(st==='flight'){
    const f=G.flight;f.t+=dt;const k=Math.min(1,f.t/f.dur);
    f.x=f.x0+(f.tgt.x-f.x0)*k;f.y=f.y0+(f.tgt.y-f.y0)*k-Math.sin(k*Math.PI)*(f.kind==='pass'?5:1);
    if(f.mv&&MOVES[f.mv].special==='curve')f.x+=Math.sin(k*Math.PI)*12*(f.x0<CX?1:-1);
    f.trail.push({x:f.x,y:f.y});if(f.trail.length>14)f.trail.shift();
    if(Math.random()<0.5)G.bubbles.push({x:f.x,y:f.y,vy:-rnd(2,8),vx:0,s:0.7,life:0.6});
    if(f.mv&&MOVES[f.mv].special==='multi'&&Math.floor(f.t*12)!==Math.floor((f.t-dt)*12)&&f.t<f.dur*0.9){G.fxRings.push({x:f.x,y:f.y,col:'#dff4ff',t:0.4});G.shake=0.12;}
    if(k>=1)landFlight();
  }
  else if(st==='goal'){G.timer-=dt;if(G.timer<=0){G.banner=null;if(Math.abs(G.score[0]-G.score[1])>=MERCY){G.mercy=true;G.half=2;endPeriod();}else if(G.clock<=0)endPeriod();else kickoff(1-G.lastScorer.team);}}
}

      setInterval(()=>reg.update(),30*60*1000);
    });
    let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!done){done=true;location.reload();}});
  });
}
</script>
</body>
