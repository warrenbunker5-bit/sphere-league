<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sphere League — 3D Movement Lab</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07132c;color:#eaf9ff;font:14px system-ui;touch-action:none}
canvas{display:block}#hud{position:absolute;top:env(safe-area-inset-top);left:18px;right:18px;pointer-events:none;text-shadow:0 2px 5px #001}
h1{font-size:17px;margin:10px 0 4px;letter-spacing:.08em}p{margin:0;max-width:500px;line-height:1.35;font-size:12px}
#pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:max(26px,env(safe-area-inset-left));width:126px;height:126px;border:2px solid #8beaff80;border-radius:50%;touch-action:none;background:#ffffff12;box-shadow:0 0 22px #22c9fa33}
#nub{position:absolute;width:46px;height:46px;left:40px;top:40px;border-radius:50%;background:#72e8ffbb;box-shadow:0 0 14px #a6ffff88}
#actions{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end}
#actions button{border:2px solid #ffc75d;color:white;background:#ad6c19c9;border-radius:50%;width:74px;height:74px;font-weight:bold;touch-action:manipulation}
#actions button:first-child{width:66px;height:66px;background:#186d9fd9;border-color:#6ceaff}
#status{position:absolute;top:73px;left:18px;font-size:12px}
#orientation{display:none;position:absolute;inset:0;background:#08152bea;z-index:10;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px}
@media(orientation:portrait){#orientation{display:flex}}
</style></head><body><div id="hud"><h1>SPHERE LEAGUE · 3D HUMAN TEST</h1><p>Landscape prototype · left joystick: swim · right: sprint / pass. One stylized Human in Riptide colors; original 2D artwork remains unchanged.</p><div id="status">Loading 3D renderer…</div></div><div id="pad"><div id="nub"></div></div><div id="actions"><button id="sprint">SPRINT</button><button id="action">PASS</button></div><div id="orientation">Rotate your phone to landscape to test the 3D controls.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color('#071b39');scene.fog=new THREE.FogExp2('#0a416a',0.012);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,300);camera.position.set(0,11,25);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight('#a4efff','#0a244c',2));const light=new THREE.DirectionalLight('#ffffff',2);light.position.set(-10,20,12);scene.add(light);
const arena=new THREE.Mesh(new THREE.SphereGeometry(23,32,20),new THREE.MeshBasicMaterial({color:'#1460a1',wireframe:true,transparent:true,opacity:.16}));scene.add(arena);
const floor=new THREE.Mesh(new THREE.CircleGeometry(22,64),new THREE.MeshStandardMaterial({color:'#0b4878',roughness:1,transparent:true,opacity:.65}));floor.rotation.x=-Math.PI/2;floor.position.y=-8;scene.add(floor);
const ball=new THREE.Mesh(new THREE.IcosahedronGeometry(.55,1),new THREE.MeshStandardMaterial({color:'#fff5b5',emissive:'#f5b932',emissiveIntensity:.65}));scene.add(ball);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.78,metalness:0});
const skin=mat('#e7a978'),dark=mat('#081e3c'),white=mat('#f5fcff');
function part(parent,geo,m,x,y,z){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);parent.add(o);return o}
function athlete(color,shorts,x,z){const root=new THREE.Group();root.position.set(x,0,z);scene.add(root);const torso=part(root,new THREE.CapsuleGeometry(1,1.5,4,8),mat(color),0,0,0);part(root,new THREE.BoxGeometry(1.8,.65,1.1),mat(shorts),0,-1.35,0);const head=part(root,new THREE.SphereGeometry(.88,12,10),skin,0,2.05,0);part(head,new THREE.BoxGeometry(1.2,.32,.25),dark,0,.04,.76);const arms=[],legs=[];for(const side of [-1,1]){const shoulder=new THREE.Group();shoulder.position.set(side*1.1,.85,0);root.add(shoulder);part(shoulder,new THREE.CapsuleGeometry(.27,1.5,3,6),skin,side*.2,-.9,0);arms.push(shoulder);const hip=new THREE.Group();hip.position.set(side*.48,-1.55,0);root.add(hip);part(hip,new THREE.CapsuleGeometry(.32,1.55,3,6),mat(shorts),0,-.9,0);legs.push(hip)}return{root,arms,legs,phase:Math.random()*6.28,vel:new THREE.Vector2(),action:0}}
// One Human athlete only. Preserve the approved Riptide palette and silhouette cues.
const human=athlete('#00c8f5','#064a91',0,0);const team=[human],opponents=[];
// Distinctive transparent face-breather and bright shoulder trim from the Human design.
const visor=new THREE.Mesh(new THREE.SphereGeometry(.94,16,12),new THREE.MeshPhysicalMaterial({color:'#b6f7ff',transparent:true,opacity:.23,roughness:.1,metalness:.05,depthWrite:false}));visor.position.set(0,2.05,.12);human.root.add(visor);
for(const side of [-1,1]){const band=new THREE.Mesh(new THREE.BoxGeometry(.42,.3,1.05),mat('#ffffff'));band.position.set(side*1.1,.95,0);human.root.add(band)}
const dorsal=new THREE.Mesh(new THREE.BoxGeometry(.12,.65,.3),mat('#ffffff'));dorsal.position.set(0,-.1,-.66);human.root.add(dorsal);
const stick={x:0,y:0},pad=document.getElementById('pad'),nub=document.getElementById('nub');function move(e){const b=pad.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(dx,dy)),d=Math.min(1,l/47);stick.x=dx/l*d;stick.y=dy/l*d;nub.style.transform=`translate(${stick.x*40}px,${stick.y*40}px)`};pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);move(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)move(e)});function release(){stick.x=stick.y=0;nub.style.transform=''}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
document.getElementById('action').onclick=()=>human.action=.65;let sprint=false;const sprintBtn=document.getElementById('sprint');sprintBtn.addEventListener('pointerdown',e=>{sprint=true;sprintBtn.setPointerCapture(e.pointerId)});sprintBtn.addEventListener('pointerup',()=>sprint=false);sprintBtn.addEventListener('pointercancel',()=>sprint=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();let elapsed=0,frames=0,report=0;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;frames++;report+=dt;
team[0].vel.lerp(new THREE.Vector2(stick.x,-stick.y).multiplyScalar(sprint?14:8),Math.min(1,dt*5));team[0].root.position.x=THREE.MathUtils.clamp(team[0].root.position.x+team[0].vel.x*dt,-18,18);team[0].root.position.z=THREE.MathUtils.clamp(team[0].root.position.z+team[0].vel.y*dt,-17,17);
for(const [i,a] of [...team,...opponents].entries()){const speed=i===0?a.vel.length():1.6;const pace=2+speed*.8;a.phase+=dt*pace;const wave=Math.sin(a.phase),swing=Math.min(1,speed/7);a.arms[0].rotation.x=wave*swing*.85;a.arms[1].rotation.x=-wave*swing*.85;a.legs[0].rotation.x=-wave*swing*.6;a.legs[1].rotation.x=wave*swing*.6;a.root.position.y=Math.sin(a.phase*.5)*.13;if(i!==0){a.root.position.z+=Math.sin(elapsed*.6+i)*dt*.7;}if(a.action>0){a.action-=dt;a.arms[1].rotation.x=-1.7*Math.sin(Math.PI*(1-a.action/.65));}if(i===0&&speed>.3)a.root.rotation.y=THREE.MathUtils.lerp(a.root.rotation.y,Math.atan2(a.vel.x,a.vel.y),dt*5)}
ball.position.copy(team[0].root.position).add(new THREE.Vector3(1.4,.2,0));ball.rotation.y+=dt*2;camera.position.lerp(new THREE.Vector3(team[0].root.position.x*.5,10,23+team[0].root.position.z*.4),dt*2);camera.lookAt(team[0].root.position.x*.5,0,team[0].root.position.z*.4);renderer.render(scene,camera);if(report>1){status.textContent=`3D test · ${Math.round(frames/report)} FPS · 1 Human · landscape touch controls · stylized prototype`;frames=0;report=0}}
loop();
</script></body></html>
